<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>主动短信受控浏览器验收</title></head><body><main id="chat"></main><div id="extensions_settings"></div><div id="extensionsMenu"></div><script type="module">
import { mountShell } from '/src/frontend/lifecycle.ts';
import { createTavernBridge } from '/src/runtime/bridge.ts';
import { createPhoneRuntime } from '/src/frontend/phone-runtime.ts';
import { createInitialState, parseState, reduceState } from '/src/runtime/model.ts';
import { enableProtagonists } from '/src/runtime/protagonist-world.ts';
import { stageAutonomousSms } from '/src/runtime/autonomous-sms.ts';

const storageKey = 'unread-city.autonomous-sms.browser-fixture.v1';
if (new URL(location.href).searchParams.has('fresh')) { localStorage.removeItem(storageKey); history.replaceState({}, '', location.pathname); }
localStorage.setItem('unread-city.presentation-mode.v1', 'novel');
let record = JSON.parse(localStorage.getItem(storageKey) || 'null');
if (!record) {
  let state = createInitialState();
  state.academics = {majorId:'computer-science',subjects:[{subjectId:'cs-programming',points:0},{subjectId:'cs-algorithms',points:0},{subjectId:'cs-networks',points:0}],lastGain:null};
  state = reduceState(enableProtagonists(state), {type:'switch_protagonist',target:'emma'});
  state.academics = {majorId:'computer-science',subjects:[{subjectId:'cs-programming',points:0},{subjectId:'cs-algorithms',points:0},{subjectId:'cs-networks',points:0}],lastGain:null};
  state.phone = []; state.protagonists.devices.emma.notifications = [];
  state.story = [{id:'browser-fixture-story',role:'assistant',text:'艾玛在安静的街角看着远处的行人。'}];
  state = stageAutonomousSms(state, reduceState(state,{type:'wait',minutes:120}), () => 0);
  record = {state:parseState(state),rawCalls:0,manualCalls:0};
}
const persist = () => localStorage.setItem(storageKey, JSON.stringify(record)); persist();
const listeners = new Map();
const eventSource = {on(n,fn){const set=listeners.get(n)||new Set();set.add(fn);listeners.set(n,set);},removeListener(n,fn){listeners.get(n)?.delete(fn);},emit(n){for(const fn of listeners.get(n)||[])fn();}};
const denied = async () => { throw Error('Fixture prohibits real model access'); };
const ctx = {characterId:0,groupId:null,chatId:'autonomous-sms-browser',mainApi:'openai',characters:[{avatar:'autonomous-sms-browser.png',name:'主动短信受控验收',data:{}}],groups:[],chat:[],chatMetadata:{},extensionSettings:{},name1:'我',name2:'主动短信受控验收',eventSource,
  eventTypes:Object.fromEntries(['CHAT_CHANGED','MESSAGE_RECEIVED','MESSAGE_SWIPED','MESSAGE_EDITED','MESSAGE_DELETED','CHARACTER_MESSAGE_RENDERED','GENERATION_AFTER_COMMANDS'].map(n=>[n,n])),
  setExtensionPrompt(){},updateMessageBlock(){},messageFormatting:v=>v,saveSettingsDebounced(){},getRequestHeaders:()=>({'Content-Type':'application/json'}),getCurrentChatId:()=>ctx.chatId,generateRaw:denied,generateQuietPrompt:denied,getThumbnailUrl:()=>''};
window.SillyTavern = {getContext:()=>ctx};
window.toastr = {info(){},warning(){},error(){},success(){}};
window.tavern_events = {CHAT_CHANGED:'chat_id_changed'};
window.eventOn = eventSource.on; window.eventRemoveListener = eventSource.removeListener;
window.getVariables = () => ({unread_city:record.state});
window.replaceVariables = value => { record.state = parseState(value.unread_city); persist(); };
window.stopGenerationById = () => true;
window.generateRaw = async config => {
  if (!config.ordered_prompts || config.ordered_prompts.length !== 2) throw Error('Invalid isolated raw prompts');
  record.rawCalls++;persist();
  return '<autonomous_sms>'+JSON.stringify({id:record.state.autonomousSms.pending.id,text:'街角的面包店刚烤好了司康，等你有空时一起尝尝吧。'})+'</autonomous_sms>';
};
window.generate = async config => {
  const source = record.state.protagonists.npcPhone.messages.findLast(row=>row.direction==='outgoing'&&row.status==='pending');
  if (!source || !config.user_input.includes(source.id)) throw Error('Fixture only supports explicit manual SMS replies');
  record.manualCalls++;persist();
  return '<phone_reply>'+JSON.stringify({messageId:source.id,text:'好呀，等你忙完再说。'})+'</phone_reply>';
};
const runtime = createPhoneRuntime(window, window);
const bridge = createTavernBridge(window);
if (!bridge) throw Error('Fixture bridge missing');
const handle = mountShell(window, window, bridge, () => {}, runtime);
window.fixtureSms = {read:()=>structuredClone(record),handle,runtime};
</script></body></html>
