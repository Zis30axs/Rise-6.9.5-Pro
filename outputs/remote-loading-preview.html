<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob: ws://127.0.0.1:5178; img-src 'self' data: blob:; media-src 'self' data: blob:; object-src 'none'">
  <title>未读之城 · 远程加载受控验收</title>
  <style>body{font:16px system-ui;margin:24px;background:#f5f1e5;color:#263c39}main{max-width:760px;margin:auto}button,input{font:inherit;padding:10px;margin:5px}p{line-height:1.7}#fixture-status{white-space:pre-wrap}</style>
  <script type="importmap">{"imports":{"/scripts/personas.js":"data:text/javascript,export%20const%20user_avatar%20%3D%20%27%27%3B","/scripts/extensions/regex/engine.js":"data:text/javascript,export%20const%20regex_placement%20%3D%20%7B%7D%3Bexport%20const%20getRegexedString%20%3D%20value%20%3D%3E%20value%3B"}}</script>
</head>
<body>
  <main>
    <h1>远程加载受控验收</h1>
    <p>本页加载最终生产脚本，使用独立内存存档和内置手机。已准备便利店、十二种库存与三位已知人物的九种表情；没有模型连接，不读写实际酒馆聊天。</p>
    <button id="fixture-enter">重新进入验收</button>
    <button id="fixture-store">进入货架验收</button>
    <button id="fixture-dialogue">展开对白验收</button>
    <label>原生输入<input id="native-input" aria-label="原生输入"></label>
    <p id="fixture-status" role="status">正在加载生产脚本…</p>
    <div id="chat"></div><div id="extensions_settings"></div><div id="extensionsMenu"></div>
  </main>
  <script type="module">
    import { createInitialState, parseState, reduceState } from '/src/runtime/model.ts';
    const status = document.getElementById('fixture-status');
    const emotions = [ ['平静','neutral'], ['开心','happy'], ['难过','sad'], ['生气','angry'], ['惊讶','surprised'], ['害羞','shy'], ['思考','thinking'], ['严肃','serious'], ['安心','relieved'] ];
    const productIds = ['meal','snack','drink','cigarette'].flatMap(category => ['basic','standard','premium'].map(tier => `${category}-${tier}`));
    let state = createInitialState();
    state.academics = { majorId: 'computer-science', subjects: ['cs-programming','cs-algorithms','cs-networks'].map(subjectId => ({ subjectId, points: 0 })), lastGain: null };
    state = reduceState(state, { type: 'novel_travel', locationId: 'convenience' });
    state.airTraffic.nextAmbientAt = Date.now() + 86400000;
    state.phone = [];
    state.inventory = productIds.map(itemId => ({ itemId, quantity: 3 }));
    state.contacts.push({ ...state.contacts[0], id: 'remote-preview-person', name: '验收同学', portraitId: 'deepseek', sourcePersonId: null, isMain: true });
    const cast = state.contacts.map(person => ({ id: person.id, speaker: person.name, portraitId: person.portraitId }));
    const rows = cast.flatMap(person => emotions.map(([emotion,key]) => ({ ...person, emotion, key, text: `${person.speaker}用${emotion}的语气讲起今天的校园生活。` })));
    state.story = [
      { id: 'remote-history', role: 'assistant', text: Array.from({length:20}, (_, index) => `第${index+1}段：傍晚的风吹过街角，商店的灯亮了起来。大家沿着校园步道慢慢走来，聊起今天的课堂与明天的安排。`).join('\n\n') },
      { id: 'remote-dialogue', role: 'assistant', text: rows.map(row => `|${row.speaker}|${row.emotion}|${row.text}|`).join('\n'), participantIds: cast.map(person => person.id) },
    ];
    state = parseState(state);
    let variables = { keep_me: 42, unread_city: state }, saves = 0, generations = 0;
    const forbiddenRequests = [];
    const originalFetch = window.fetch.bind(window);
    window.fetch = (input, options) => {
      const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
      if (['data:', 'blob:'].includes(url.protocol) || (url.origin === location.origin && !url.pathname.startsWith('/api/'))) return originalFetch(input, options);
      forbiddenRequests.push(url.href);
      return Promise.reject(new Error('受控验收禁止外部或真实酒馆 API 请求'));
    };
    const denied = async () => { generations++; throw new Error('受控验收没有模型连接'); };
    const listeners = new Map();
    const eventSource = {
      on(name, listener) { const set = listeners.get(name) || new Set(); set.add(listener); listeners.set(name, set); },
      removeListener(name, listener) { listeners.get(name)?.delete(listener); },
      emit(name, ...args) { for (const listener of [...listeners.get(name) || []]) listener(...args); },
    };
    const context = {
      characterId: 0, groupId: null, chatId: 'remote-loading-preview', mainApi: 'openai',
      characters: [{ avatar: 'remote-loading-preview.png', name: '远程加载受控验收', data: {} }],
      groups: [], chat: [], chatMetadata: {}, extensionSettings: {}, name1: '我', name2: '远程加载受控验收',
      eventSource, eventTypes: Object.fromEntries(['CHAT_CHANGED','MESSAGE_RECEIVED','MESSAGE_SWIPED','MESSAGE_EDITED','MESSAGE_DELETED','CHARACTER_MESSAGE_RENDERED','GENERATION_AFTER_COMMANDS'].map(name => [name,name])),
      setExtensionPrompt() {}, updateMessageBlock() {}, messageFormatting: text => text,
      saveSettingsDebounced() {}, getRequestHeaders: () => ({ 'Content-Type': 'application/json' }),
      getCurrentChatId: () => context.chatId, generateRaw: denied, generateQuietPrompt: denied, getThumbnailUrl: () => '',
    };
    window.SillyTavern = { getContext: () => context };
    window.toastr = { info() {}, warning() {}, error() {}, success() {} };
    localStorage.setItem('unread-city.presentation-mode.v1', 'novel');
    window.remoteLoadingFixture = {
      read: () => structuredClone(variables), counters: () => ({ saves, generations, forbiddenRequests: [...forbiddenRequests] }),
      rows, productIds, bundleUrl: new URL('/remote-loading-production.js', location.href).href,
    };
    const frame = document.createElement('iframe'); frame.id = 'remote-loading-helper'; frame.hidden = true;
    const ready = new Promise((resolve, reject) => { frame.onload = resolve; frame.onerror = reject; });
    frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>';
    document.body.append(frame);
    await ready;
    const helper = frame.contentWindow;
    helper.tavern_events = { CHAT_CHANGED: 'chat_id_changed' };
    helper.getVariables = () => variables;
    helper.replaceVariables = next => { variables = next; saves++; };
    helper.eventOn = (event, callback) => eventSource.on(event, callback);
    helper.eventRemoveListener = (event, callback) => eventSource.removeListener(event, callback);
    helper.getButtonEvent = name => `button:${name}`;
    helper.generate = denied;
    helper.stopGenerationById = () => true;
    const script = helper.document.createElement('script');
    // Vite's public directory serves these bytes verbatim; /dist/*.js would be transformed.
    // The Playwright fixture prepares this temporary copy from the final build.
    script.src = '/remote-loading-production.js';
    script.onload = () => { document.body.dataset.fixtureReady = 'true'; status.textContent = '生产脚本已加载；浏览、对白推进和窗口开关不会调用模型。'; };
    script.onerror = () => { document.body.dataset.fixtureError = 'true'; status.textContent = '生产脚本加载失败，请先完成构建。'; };
    helper.document.body.append(script);
    const enter = () => window.__unreadCityShell?.open();
    const shell = () => document.querySelector('[data-unread-city-root]')?.shadowRoot;
    const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    document.getElementById('fixture-enter').addEventListener('click', enter);
    document.getElementById('fixture-store').addEventListener('click', async () => {
      enter(); await settle(); shell()?.querySelector('[data-location-entry]')?.click();
      await settle(); shell()?.querySelector('[data-place-store]')?.click();
    });
    document.getElementById('fixture-dialogue').addEventListener('click', async () => {
      enter(); await settle(); const button = shell()?.querySelector('[data-toggle-dialogue]');
      if (button?.getAttribute('aria-expanded') === 'false') button.click();
    });
  </script>
</body>
</html>
