<!doctype html>
<html lang="zh-CN" data-unread-city-demo>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>未读之城 · 沉浸式原型</title>
  <style>
    body{margin:0;background:#eeeae0;color:#263c39;font:16px/1.7 system-ui,sans-serif;padding:8vh 7vw;box-sizing:border-box;min-height:100vh}main{max-width:880px;margin:auto}small{letter-spacing:.14em}h1{font-size:clamp(30px,6vw,60px);margin:.4em 0}p{max-width:640px}button,select{font:inherit;padding:12px 18px;border:1px solid #c3c9bd;border-radius:8px;background:white;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #b5782a}#demo-controls{display:flex;gap:12px;flex-wrap:wrap;padding:20px 0}#native-input{display:block;margin-top:28px;padding:16px;width:100%;max-width:600px;box-sizing:border-box}#unread-city-feedback{white-space:pre-wrap;color:#a43d2c}
  </style>
</head>
<body>
<main id="native-preview">
  <small>UNREAD CITY / INTEGRATION PREVIEW</small>
  <h1>你已回到原生界面</h1>
  <p>这是用于验证接管与恢复的本地宿主，不是真实的 SillyTavern。演示内容只保存在本次浏览器会话的内存里；刷新即可清空。</p>
  <div id="demo-controls">
    <button id="enter-city" type="button">进入未读之城</button>
    <label>当前聊天 <select id="demo-chat"><option value="demo-a">演示聊天 A</option><option value="demo-b">演示聊天 B</option></select></label>
    <button id="demo-switch" type="button">切换演示聊天</button>
    <button id="demo-failure" type="button">模拟下一次生成失败</button>
  </div>
  <p id="demo-session">当前：演示聊天 A</p>
  <p>按 Esc 或点击独立的“恢复酒馆”按钮可退出。切换聊天后需重新进入，两个聊天的进度相互独立。</p>
  <label for="native-input">原生输入框（用于检查恢复后的键盘焦点）</label>
  <input id="native-input" placeholder="退出后仍可输入" />
  <p id="unread-city-feedback" role="status"></p>
</main>
<script type="module" src="/src/frontend/main.ts"></script>
</body>
</html>
