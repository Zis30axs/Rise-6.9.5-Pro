name: Game calendar and reporting prologue

on:
  push:
    branches: [feat/calendar-2025-08-28]
  pull_request:
    branches: [lite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow
      - name: Restore pinned offline phone sources
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Type-check and bundle the real offline embedded phone
        run: npm run build
      - name: Date, academic, background, phone and narrative regressions
        run: npx vitest run tests/game-calendar.test.ts tests/academics.test.ts tests/background-life.test.ts tests/dual-protagonists.test.ts tests/phone-appearance.test.ts tests/dual-narrative.test.ts --maxWorkers=1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Date and report-day UI on desktop and mobile
        run: npx playwright test tests/e2e/game-calendar.spec.ts --workers=1 --max-failures=1 --reporter=line
