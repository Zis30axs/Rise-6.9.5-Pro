name: Validate adjustable HUD on lite PR
on:
  push:
    branches: [fix/customizable-shell-layout-20261020]
  pull_request:
    branches: [lite]
permissions:
  contents: read
jobs:
  layout-and-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install Pillow playwright
          npm ci
      - name: Restore pinned ST-iPhonie and local phone patch
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Unit tests including layout persistence and lifecycle
        run: npx vitest run --maxWorkers=1
      - name: Install Chromium for four-viewport browser validation
        run: |
          npx playwright install --with-deps chromium
          python -m playwright install chromium
      - name: Browser tests for editable HUD and dock clearance
        run: npx playwright test tests/e2e/shell.spec.ts --grep '布局编辑与底栏无遮挡' --workers=1
      - name: Browser screenshots and keyboard/viewport regression
        run: |
          BROWSER_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python scripts/verify_shell_viewport.py --chromium "$BROWSER_BIN" --output outputs/ui-layout-ci
      - name: Verify Lite PNG and offline ZIP still package
        run: |
          python scripts/build_lite_release.py
          python scripts/build_lite_card.py
          python scripts/build_tauri_import_card.py --source dist/unread-city-lite.png --output dist/unread-city-lite-tauri.png
          python scripts/verify_lite_release.py
      - name: Upload browser evidence and audited Lite bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-lite-verification
          path: |
            outputs/ui-layout-ci/**
            test-results/**
            dist/lite-verification.json
          if-no-files-found: warn
          retention-days: 14
