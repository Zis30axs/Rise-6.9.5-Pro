name: Weekly memory and prompt pruning

on:
  push:
    branches: [feat/weekly-memory-prompt-pruning-20261021, 'fix/weekly-memory-*']
  pull_request:
    branches: [lite]

permissions:
  contents: read

jobs:
  weekly-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow
      - name: Restore pinned embedded phone and existing patch
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Typecheck and build real embedded frontend
        run: npm run build
      - name: Weekly memory, token pruning and lifecycle regressions
        run: npx vitest run --maxWorkers=1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check narrative layouts at desktop and mobile viewports
        run: npx playwright test tests/e2e/dual-narrative.spec.ts tests/e2e/weekly-memory.spec.ts --workers=1 --max-failures=1 --reporter=line
      - name: Save UI checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-memory-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/dual-narrative-qa/
            outputs/weekly-memory-qa/
            test-results/
