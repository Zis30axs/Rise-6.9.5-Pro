name: Lite SMS AI reply and map integration

on:
  push:
    branches: [feat/lite-llm-phone-replies-20261021]
  pull_request:
    branches: [lite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow
      - name: Reconstruct the existing local-only embedded phone
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Type-check and build the real phone and card frontend
        run: npm run build
      - name: Phone replies, dual-player state, map and narrative regressions
        run: npx vitest run tests/phone-reply.test.ts tests/dual-protagonists.test.ts tests/background-life.test.ts tests/phone-appearance.test.ts tests/story-phone.test.ts tests/world-map.test.ts tests/story-protocol.test.ts --maxWorkers=1
      - name: Inspect no generated artifacts or release mutation
        run: |
          git status --short
          test -f dist/immersive-shell.js
