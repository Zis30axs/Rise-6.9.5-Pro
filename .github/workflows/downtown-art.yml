name: Downtown art contract
on:
  push:
    branches: [recovery/downtown-sakiko-20261020]
permissions:
  contents: read
jobs:
  art-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - name: Portrait policy tests
        run: node --experimental-strip-types --test tests/sakiko-art-policy.node.mjs
      - name: Image and embedded-card gate tests
        run: python -m unittest discover -s tests -p test_downtown_art_gate.py -v
      - name: Check actual review state and image files
        run: python scripts/check_downtown_art_status.py
      - name: Source checkpoint for isolated development
        run: git archive --format=zip -o downtown-source-checkpoint.zip HEAD src scripts tests integration .github package.json package-lock.json tsconfig.json vite.config.ts vitest.config.ts playwright.config.ts index.html AGENTS.md CODEX.md DeepSeek.md README.md
      - uses: actions/upload-artifact@v4
        with:
          name: downtown-source-checkpoint
          path: downtown-source-checkpoint.zip
          retention-days: 7
