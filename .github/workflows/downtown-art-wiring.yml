name: Downtown art runtime wiring
on:
  push:
    branches: [recovery/downtown-sakiko-20261020]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - run: npm ci
      - name: Reproduce the preserved phone source without publishing it
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Artwork policy and pack tests
        run: |
          node --experimental-strip-types --test tests/sakiko-art-policy.node.mjs
          python -m unittest discover -s tests -p 'test*.py' -v
          python scripts/check_downtown_art_status.py
      - name: Generate the preserved phone and artwork modules
        run: npm run art:build && npm run phone:build
      - name: Whole-project regression
        run: npx vitest run --maxWorkers=1
      - name: Build and check the appropriate release state
        run: |
          if python -c "import json,sys; sys.exit(json.load(open('integration/downtown-art/manifest.json'))['reviewStatus'] != 'approved')"; then
            npm run card:art
          else
            npm run card
            if npm run card:art; then
              echo 'ERROR: unreviewed artwork was released'
              exit 1
            fi
          fi
      - name: Audit actual final packaging
        if: hashFiles('dist/unread-city-downtown-art-tauri.png') != ''
        run: python scripts/audit_downtown_release.py
      - name: Install headless test browser
        run: npx playwright install --with-deps chromium
      - name: Final artwork and real embedded phone at four viewports
        if: hashFiles('dist/unread-city-downtown-art-tauri.png') != ''
        run: npx playwright test tests/e2e/downtown-art.spec.ts --workers=1 --reporter=line
      - name: Preserve actual build outputs
        uses: actions/upload-artifact@v4
        with:
          name: downtown-art-build
          path: |
            dist/unread-city-downtown-art-tauri.png
            outputs/downtown-art-release.json
            outputs/downtown-art-packaging-audit.json
            outputs/downtown-art-qa/
          if-no-files-found: ignore
          retention-days: 14
