name: Downtown art runtime wiring
on:
  push:
    branches: [recovery/downtown-sakiko-20261020]
    paths:
      - .github/workflows/downtown-art-wiring.yml
      - scripts/wire_downtown_art.py
permissions:
  contents: read
jobs:
  wire:
    if: github.repository == 'Zis30axs/Rise-6.9.5-Pro' && github.ref == 'refs/heads/recovery/downtown-sakiko-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Wire only the two reviewed App.vue attributes
        run: python3 scripts/wire_downtown_art.py
      - name: Publish without overwriting concurrent changes
        id: publish
        run: |
          if ! git diff --quiet -- src/frontend/App.vue; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- src/frontend/App.vue
            git commit -m 'feat: pass scene and location into reviewed downtown artwork renderers'
            git push origin HEAD:recovery/downtown-sakiko-20261020
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: wire
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wire.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - run: npm ci
      - name: Fixed phone source; no changes to the public repository
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
      - name: Artwork policy and pack tests
        run: |
          node --experimental-strip-types --test tests/sakiko-art-policy.node.mjs
          python -m unittest discover -s tests -p 'test_downtown_art_*.py' -v
      - name: Actual type check and preview packaging
        run: npm run card
      - name: Whole-project regression
        run: npx vitest run --maxWorkers=1
      - name: Verify that missing final art blocks a final release
        run: |
          if npm run card:art; then
            echo 'ERROR: a pending art manifest was released'
            exit 1
          fi
      - name: Preserve tested source and explicit verification boundary
        run: |
          mkdir -p outputs
          git rev-parse HEAD > outputs/downtown-art-tested-commit.txt
          printf '%s\n' 'Runtime wiring validated. Final illustrations are NOT installed. No physical iPhone or final-art viewport acceptance.' > outputs/downtown-art-test-boundary.txt
          git archive --format=zip -o downtown-art-runtime-source.zip HEAD src scripts tests integration .github package.json package-lock.json tsconfig.json vite.config.ts vitest.config.ts playwright.config.ts index.html AGENTS.md CODEX.md DeepSeek.md README.md
      - uses: actions/upload-artifact@v4
        with:
          name: downtown-art-runtime-source-NOT-final-art
          path: |
            downtown-art-runtime-source.zip
            outputs/downtown-art-tested-commit.txt
            outputs/downtown-art-test-boundary.txt
          retention-days: 7
