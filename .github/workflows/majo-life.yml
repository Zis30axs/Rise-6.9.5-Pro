name: Majo life and social world

on:
  push:
    branches: [feat/lite-majo-cast-assets-20261021]
  pull_request:
    branches: [lite]
    paths: ['src/**', 'tests/**', 'integration/**', '.github/workflows/majo-life.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  majo-life:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve reproducible source snapshot
        run: |
          git archive --format=tar.gz --output=majo-source.tar.gz HEAD src tests scripts integration assets package.json package-lock.json tsconfig.json vite.config.ts vitest.config.ts playwright.config.ts index.html AGENTS.md DeepSeek.md CODEX.md README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: majo-source-${{ github.sha }}
          path: majo-source.tar.gz
          retention-days: 3
      - uses: actions/setup-node@v4
        if: hashFiles('tests/majo-life.test.ts') != ''
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        if: hashFiles('tests/majo-life.test.ts') != ''
        with:
          python-version: '3.13'
      - name: Build and test
        if: hashFiles('tests/majo-life.test.ts') != ''
        run: |
          npm ci
          python -m pip install Pillow
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          npm run build
          npx vitest run --maxWorkers=1
      - name: Browser checks
        if: hashFiles('tests/e2e/majo-life.spec.ts') != ''
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/majo-life.spec.ts --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('tests/majo-life.test.ts') != ''
        with:
          name: majo-life-qa-${{ github.sha }}
          path: |
            outputs/majo-life-qa/
            test-results/
          retention-days: 7
          if-no-files-found: warn
