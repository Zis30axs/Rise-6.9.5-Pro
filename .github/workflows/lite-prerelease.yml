name: Build Lite offline ZIP pre-release
on:
  push:
    branches: [lite]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New immutable pre-release tag, for example lite-v0.1.0-rc3'
        required: true
        type: string
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and Node dependencies
        run: |
          python -m pip install Pillow
          npm ci
      - name: Restore precisely pinned and locally patched ST-iPhonie (no publishing)
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Verify source and resource loader
        run: |
          if compgen -G 'tests/test*.py' > /dev/null; then
            python -m unittest discover -s tests -p 'test*.py' -v
          else
            echo 'No tests/test*.py in this tree; skipping Python unittest discovery'
          fi
          node --check scripts/lite_asset_loader.js
          if [ -f tests/sakiko-art-policy.node.mjs ]; then
            node --experimental-strip-types --test tests/sakiko-art-policy.node.mjs
          else
            echo 'tests/sakiko-art-policy.node.mjs is not in this tree; skipping'
          fi
          python scripts/check_downtown_art_status.py
      - name: Build existing phone, artwork and frontend
        run: |
          npm run build
          npx vitest run --maxWorkers=1
      - name: Construct and audit Lite card and offline ZIP
        run: |
          python scripts/build_lite_release.py
          node --check dist/immersive-shell-lite.js
          python scripts/build_lite_card.py
          python scripts/build_tauri_import_card.py --source dist/unread-city-lite.png --output dist/unread-city-lite-tauri.png
          python scripts/verify_lite_release.py
          python - <<'PY'
          import json
          r=json.load(open('dist/lite-verification.json'))
          assert r['status']=='passed-build-only-not-tested-on-iphone'
          assert r['approvedNewArtExternalized']==24
          print('PASS',r['liteCardBytes'],'PNG bytes;',r['zipBytes'],'ZIP bytes;',r['externalAssets'],'resources')
          PY
      - name: Preserve built PNG, ZIP and audit as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unread-city-lite-offline-prerelease
          path: |
            dist/unread-city-lite-tauri.png
            dist/unread-city-lite-tauri.verification.json
            dist/unread-city-lite-assets.zip
            dist/lite-verification.json
            dist/lite-assets-report.json
          if-no-files-found: error
          retention-days: 30
      # Pushes build and upload artifacts only. No existing tag or Release is ever removed.
      - name: Publish NEW immutable pre-release (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^lite-v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo '::error::Tag must look like lite-vX.Y.Z-rcN'; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace"; exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to move"; exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          sha = os.environ['GITHUB_SHA']
          info = json.loads(Path('dist/lite-verification.json').read_text('utf-8'))
          notes = [
              f'# 未读之城 Lite · {tag}',
              '',
              f'构建源提交：`{sha}`。本次交付是该提交的 Lite PNG + 本地 ZIP。',
              '',
              '## 使用说明',
              '- `unread-city-lite-tauri.png`：导入 TauriTavern 的 Character Card V2 PNG。',
              '- `unread-city-lite-assets.zip`：配套离线 ZIP，不是联网下载；不要当角色卡导入。',
              '- `lite-verification.json` / `lite-assets-report.json`：构建校验。',
              '进入角色聊天后点“安装 Lite 素材 ZIP”，选取文件，安装后刷新。',
              '',
              '## 校验',
              f"- PNG: {info['liteCardBytes']} bytes，SHA-256 `{info['liteCardSha256']}`",
              f"- ZIP: {info['zipBytes']} bytes，SHA-256 `{info['zipSha256']}`",
              f"- 离线资源：{info['externalAssets']} 项；离线：{info['offline']}",
              '',
              '**边界：**构建验证通过，不等于已在 iPhone / TauriTavern 真机验收。',
              '此发行以本标签的提交与哈希为准，不沿用旧版 RC2 的功能说明。',
          ]
          Path('dist/lite-release-notes.md').write_text('\n'.join(notes) + '\n', encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" \
            dist/unread-city-lite-tauri.png \
            dist/unread-city-lite-assets.zip \
            dist/lite-verification.json \
            dist/lite-assets-report.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "未读之城 Lite $RELEASE_TAG" \
            --notes-file dist/lite-release-notes.md
