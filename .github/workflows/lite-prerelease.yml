name: Build Lite offline ZIP pre-release
on:
  push:
    branches: [lite]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New immutable pre-release tag, for example lite-v0.4.0-rc3'
        required: true
        type: string
permissions:
  contents: write
jobs:
  rc31_png_only:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[rc31-png-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch just the PNG patch script (no 1GB repository checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/contents/scripts/publish_lite_rc31_png_only.py?ref=${{ github.sha }}" --jq .content | base64 -d > publish_rc31.py
      - name: Prepare Lite RC3.1 PNG (no ZIP and no Release write)
        env:
          GH_TOKEN: ${{ github.token }}
          RC31_PNG_ARTIFACT_ONLY: '1'
        run: python3 publish_rc31.py
      - name: Verify RC3.1 PNG checksum against first successful patch
        run: echo "6b58d6669066b9f39bcc321d5aa78063a339e8eda9a5ed2a0ea4d5731bbdaa31  unread-city-lite-v0.3.0-rc3.1-tauri.png" | sha256sum -c -
      - name: Upload RC3.1 PNG as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-v0.3.0-rc3.1-tauri-png
          path: unread-city-lite-v0.3.0-rc3.1-tauri.png
          if-no-files-found: error
          retention-days: 30

  prerelease:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[rc31-png-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python and Node dependencies
        run: |
          python -m pip install Pillow
          npm ci
      - name: Restore precisely pinned and locally patched ST-iPhonie (no publishing)
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Verify source and resource loader
        run: |
          python scripts/validate_card.py
          node --check scripts/lite_asset_loader.js
          python scripts/check_downtown_art_status.py
          node --test tests/*.node.mjs
      - name: Build existing phone, artwork, frontend and Lite card
        run: |
          npm run build
          npm run check:no-ja
          npx vitest run tests/novel-portrait-size.test.ts tests/shell-viewport.test.ts tests/flat-map.test.ts
      - name: Construct and audit Tauri Lite card and offline ZIP
        run: |
          node --check dist/immersive-shell-lite.js
          python scripts/build_tauri_import_card.py --source dist/unread-city-lite.png --output dist/unread-city-lite-tauri.png
          python scripts/verify_lite_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('dist/lite-verification.json').read_text(encoding='utf-8'))
          rep = json.loads(Path('dist/lite-assets-report.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('integration/downtown-art/manifest.json').read_text(encoding='utf-8'))
          assert r['status'] == 'passed-build-only-not-tested-on-iphone'
          assert r['sha256Verification'] == 'not-required'
          assert r['approvedNewArtExternalized'] == len(manifest['assets'])
          assert r['tokyoSandboxSeparatePack'] is False and r['tokyoSandboxInCoreZip'] is True
          assert r['tokyoSandboxArchive'] == 'unread-city-lite-assets.zip'
          assert rep['californiaSandboxSeparatePack'] is False and rep['californiaSandboxInCoreZip'] is True
          assert rep['californiaSandboxArchive'] == 'unread-city-lite-assets.zip'
          print('PASS', r['liteCardBytes'], 'PNG bytes;', r['zipBytes'], 'ZIP bytes;', r['externalAssets'], 'resources;', r['approvedNewArtExternalized'], 'downtown art')
          PY
      - name: Preserve built PNG, ZIP and audit as CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unread-city-lite-offline-prerelease
          path: |
            dist/unread-city-lite-tauri.png
            dist/unread-city-lite-tauri.verification.json
            dist/unread-city-lite.png
            dist/unread-city-lite-assets.zip
            dist/lite-verification.json
            dist/lite-assets-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish NEW immutable pre-release (manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^lite-v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo '::error::Tag must look like lite-vX.Y.Z-rcN'; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to replace"; exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; refusing to move"; exit 1
          fi
          python - <<'PY'
          import hashlib, json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          sha = os.environ['GITHUB_SHA']
          card_json = json.loads(Path('src/card.json').read_text('utf-8'))
          char_ver = card_json['data']['character_version']
          ver_num = tag.removeprefix('lite-v')

          dist = Path('dist')
          out = dist / 'release-bundle'
          out.mkdir(parents=True, exist_ok=True)

          tauri_dst = out / f'unread-city-{tag}-tauri.png'
          canon_dst = out / f'unread-city-{tag}.png'
          zip_dst = out / f'unread-city-{tag}-assets.zip'
          live2d_dst = out / 'unread-city-live2d.zip'
          ver_dst = out / f'unread-city-{tag}-verification.json'
          readme_dst = out / 'README.txt'
          sums_dst = out / 'SHA256SUMS.txt'
          notes_dst = out / 'RELEASE_NOTES.md'

          shutil.copy2(dist / 'unread-city-lite-tauri.png', tauri_dst)
          shutil.copy2(dist / 'unread-city-lite.png', canon_dst)
          shutil.copy2(dist / 'unread-city-lite-assets.zip', zip_dst)
          shutil.copy2(Path('assets/live2d-ensemble/unread-city-live2d.zip'), live2d_dst)

          def sha256_of(p: Path) -> str:
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          lite_ver = json.loads((dist / 'lite-verification.json').read_text('utf-8'))
          assets_rep = json.loads((dist / 'lite-assets-report.json').read_text('utf-8'))
          tauri_ver = json.loads((dist / 'unread-city-lite-tauri.verification.json').read_text('utf-8'))
          tauri_ver['source'] = 'dist/unread-city-lite.png'
          tauri_ver['artifact'] = 'dist/unread-city-lite-tauri.png'

          verification = {
              'tag': tag,
              'characterVersion': char_ver,
              'immersiveVersion': ver_num,
              'builtAt': datetime.now(timezone.utc).isoformat(),
              'commit': sha,
              'physicalDeviceTested': False,
              'liteVerification': lite_ver,
              'assetsReport': assets_rep,
              'tauriVerification': tauri_ver,
              'live2dExtension': {
                  'archive': 'unread-city-live2d.zip',
                  'bytes': live2d_dst.stat().st_size,
                  'sha256': sha256_of(live2d_dst),
                  'models': 94,
                  'assets': 1931,
                  'coreReused': 1,
              },
          }
          ver_dst.write_text(json.dumps(verification, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_lines = [
              f'未读之城 Lite {ver_num}',
              f'角色卡版本: {char_ver}（扩展版本 {ver_num}）',
              f'源提交: {sha} (lite)',
              '',
              '文件说明:',
              f'1. {tauri_dst.name} ({tauri_dst.stat().st_size} B)',
              '   TauriTavern / 移动端压缩角色卡（25 MB 限制内，无损 zlib zTXt 元数据）',
              f'2. {canon_dst.name} ({canon_dst.stat().st_size} B)',
              '   SillyTavern 规范 tEXt 角色卡',
              f'3. {zip_dst.name} ({zip_dst.stat().st_size} B)',
              f'   核心离线素材包（必装，共 {lite_ver["externalAssets"]} 项资源，含东京/加州/北京 3D 沙盘、36 张市区立绘、离线二维底图与贴纸）',
              f'4. {live2d_dst.name} ({live2d_dst.stat().st_size} B)',
              '   可选十人 Live2D 衣橱扩展包（选装，共 94 套造型，不装时保留现有立绘回退）',
              '',
              '安装步骤:',
              '1. 按客户端选择导入 -tauri.png（TauriTavern / 手机端）或规范 .png（桌面酒馆）。',
              f'2. 打开聊天后，点击页面上的「安装 Lite 素材 ZIP」按钮，选择 {zip_dst.name} 并刷新页面。建议新建聊天。',
              '3. 如需解锁全部十人多套换装 Live2D，可再通过页面扩展衣橱按钮导入 unread-city-live2d.zip。',
              '注意: .zip 是离线素材包，不是角色卡，请勿用“导入角色卡”功能打开。',
              '',
              '说明: 尚未进行 iPhone / TauriTavern 真机实际导入验收；SHA256SUMS.txt 仅供校验参考，非安装前置条件。',
          ]
          readme_dst.write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')

          sum_files = [tauri_dst, canon_dst, zip_dst, live2d_dst, ver_dst, readme_dst]
          sums_dst.write_text(''.join(f'{sha256_of(p)}  {p.name}\n' for p in sum_files), encoding='utf-8')

          notes = f"""# 未读之城 Lite v{ver_num} · 五项常驻导航重构 / 左舞台右书卷与手机三档抽屉 / 手机外壳精简 / 十四档好感与二维导航地图

          ## 本次主要更新（自 `lite-v0.4.0-rc2`）

          - **全屏 Shell 五项常驻导航与响应式舞台重构**：
            - 常驻导航由 14 个零散入口收拢为 5 项：`故事`、`地图`、`手机`（常驻暖金主入口 + 未读角标）、`路线`（可执行决议角标）、`我`（待回应邀约角标）；桌面端采用右侧 `80px` 纵栏（`手机`置顶），窄屏（`<= 760px`）采用底部 `62px` 固定栏（`手机`居中上抬圆形主按钮）。
            - 桌面端改为「左舞台 + 右书卷栏」分栏布局，立绘舞台不再被弹窗遮挡；窄屏正文改为可拖拽/点击切换的三档底部抽屉（`peek` / `half` / `full`）。
            - 正文输入框上方新增语境化「此处」互动条，聚合当面交谈、室内活动、下厨、店铺服务/打包、便利店/文具店/选书/公交及相邻去处；顶栏精简为单行，四主角切换、字号、画面方式、立绘刷新与角色方向自然中文开关统一收入 `⋯` 菜单。
          - **「路线」与「我」面板深度减法重排**：
            - `路线` 合并 `国策`（首屏直出可缩放路线树 + 底部滑出详情抽屉）与 `决议`（分类筛选芯片 + 单行可展开条目 + 右侧金色 `⚡消耗` 按钮），移除重复列表与扫描线装饰。
            - `我` 按 `身心 / 随身 / 关系 / 手账` 四页签统一收拢状态、学业课程、Appie Pay 跳转、东都证券、学生证、衣柜、内嵌随身背包与珍藏装备、内嵌邀约簿、乐队/社交圈/联合体、手账本与专业课表。
          - **内嵌手机外壳与视觉精简**：
            - 手机桌面收敛为单页剧情应用，底部快捷栏直达「消息」，酒馆工具统一收入「设置 → 酒馆工具」；移除剧情应用重复眉标与页底卡片，补齐三张银行卡专属徽记及东都证券、Twiitch 主题图标，修复证券 K 线首帧尺寸放大问题。
          - **自 `rc2` 以来的内容与地图合入**：
            - 包含离线二维导航地图与窄屏地区菜单修复、十四档好感人设（814 条世界书）与 30 条地点彩蛋、丰川瑞穗在世世界线、高原住宅区与飞鸟山公园等更新。

          ## 附件清单与安装说明

          | 文件 | 大小 | 用途 |
          | --- | --- | --- |
          | `{tauri_dst.name}` | {tauri_dst.stat().st_size:,} B | TauriTavern / 移动端压缩角色卡（<25 MB，无损 zlib zTXt 元数据） |
          | `{canon_dst.name}` | {canon_dst.stat().st_size:,} B | 桌面 SillyTavern 规范 `tEXt` 角色卡 |
          | `{zip_dst.name}` | {zip_dst.stat().st_size:,} B | **必装** 核心离线素材包（{lite_ver['externalAssets']} 项资产） |
          | `unread-city-live2d.zip` | {live2d_dst.stat().st_size:,} B | **选装** 十人 Live2D 衣橱扩展包（94 套造型 / 1,931 项资产） |
          | `{ver_dst.name}` | - | 构建与资源核验报告 |
          | `SHA256SUMS.txt` | - | 文件 SHA-256 校验值（仅供参考，非安装门槛） |
          | `README.txt` | - | 离线安装说明 |

          **安装步骤：**
          1. 按客户端导入对应角色卡 PNG（TauriTavern / 手机端用 `-tauri.png`，桌面 SillyTavern 用规范 `.png`）。
          2. 打开聊天后，点击页面中的「安装 Lite 素材 ZIP」按钮，选择 `{zip_dst.name}`，导入完成后刷新页面。建议新建聊天。
          3. 如需开启十人多服装 Live2D，可再通过页面扩展衣橱按钮导入 `unread-city-live2d.zip`。
          4. `.zip` 文件是离线素材包，不是角色卡，请勿用“导入角色卡”功能导入。

          ## 构建与校验边界

          - 源提交：`{sha}`（分支 `lite`，角色卡版本 `{char_ver}`，扩展版本 `{ver_num}`）
          - 构建链通过：东京/加州/北京 GLB 校验、36 张审定市区立绘、`ST-iPhonie`（`0.7.83-fish-mobile.5`）打包、`vue-tsc --noEmit`、`vite build`（970 模块）、`node --check dist/immersive-shell-lite.js`、`scripts/verify_lite_release.py`（`passed-build-only-not-tested-on-iphone`）、`scripts/validate_card.py`（814 条世界书条目）。
          - 四视口受控浏览器验收通过：`1440×900`、`1280×800`、`390×844`、`320×568` 共 40 张页面截图无报错、无横向溢出、无日文假名与开发提示词残留（记录见仓库 `outputs/redesign-qa/`）。
          - **边界声明**：本次为构建与受控桌面浏览器视口验收通过，**尚未进行 iPhone / Android 物理真机与 TauriTavern 实际导入验收**。
          """
          notes_clean = '\n'.join(line[10:] if line.startswith('          ') else line for line in notes.splitlines()) + '\n'
          notes_dst.write_text(notes_clean, encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" \
            "dist/release-bundle/unread-city-${RELEASE_TAG}-tauri.png" \
            "dist/release-bundle/unread-city-${RELEASE_TAG}.png" \
            "dist/release-bundle/unread-city-${RELEASE_TAG}-assets.zip" \
            "dist/release-bundle/unread-city-live2d.zip" \
            "dist/release-bundle/unread-city-${RELEASE_TAG}-verification.json" \
            "dist/release-bundle/SHA256SUMS.txt" \
            "dist/release-bundle/README.txt" \
            --target "$GITHUB_SHA" --prerelease \
            --title "未读之城 Lite v${RELEASE_TAG#lite-v} · 五项常驻导航重构 / 左舞台右书卷与手机三档抽屉 / 手机外壳精简" \
            --notes-file dist/release-bundle/RELEASE_NOTES.md
