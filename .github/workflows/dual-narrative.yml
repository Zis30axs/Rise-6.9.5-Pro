name: Dual protagonist narratives

on:
  push:
    branches: [feat/background-life-20261021]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narratives:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow
      - name: Restore the pinned phone source and existing private patch
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Type-check and build the production frontend with the real embedded phone
        run: npm run build
      - name: Narrative, state and lifecycle regression
        run: npx vitest run tests/background-life.test.ts tests/dual-narrative.test.ts tests/dual-protagonists.test.ts tests/phone-appearance.test.ts tests/lifecycle.test.ts tests/story-phone-lifecycle.test.ts --maxWorkers=1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Both protagonists at four desktop and mobile viewports
        run: npx playwright test tests/e2e/dual-narrative.spec.ts --workers=1 --max-failures=1 --reporter=line
      - name: Preserve narrative screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-narrative-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/dual-narrative-qa/
            test-results/
