name: Validate adjustable HUD PR
on:
  push:
    branches: [fix/customizable-shell-layout-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - run: npm ci
      - name: Restore pinned, locally patched phone source
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Full frontend type-check and production compile
        run: npm run build
      - name: Layout and native recovery unit checks
        run: npx vitest run tests/shell-layout.test.ts tests/lifecycle.test.ts --maxWorkers=1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Four-screen real DOM and dock-clearance regression
        run: npx playwright test tests/e2e/ui-layout.spec.ts --workers=1 --reporter=line
      - name: Preserve layout screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adjustable-hud-layout-qa
          path: |
            outputs/ui-layout-qa/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
