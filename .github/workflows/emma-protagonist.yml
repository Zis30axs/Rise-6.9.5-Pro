name: Emma third protagonist

on:
  push:
    branches: [feat/lite-emma-third-protagonist-20261022]
  pull_request:
    branches: [feat/lite-majo-visual-integration]
    paths:
      - tests/third-protagonist.test.ts
      - tests/e2e/emma-switch.spec.ts
      - src/**
      - integration/dual-protagonists/**
      - integration/third-protagonist/**
      - .github/workflows/emma-protagonist.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emma-protagonist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install Pillow
      - name: Restore pinned embedded phone and existing patch
        run: |
          git init ../ST-iPhonie
          git -C ../ST-iPhonie remote add origin https://github.com/Zis30axs/ST-iPhonie.git
          git -C ../ST-iPhonie fetch --depth 1 origin 24295193aa1adff606edcd4e63c8b07923533f2b
          git -C ../ST-iPhonie checkout --detach FETCH_HEAD
          git -C ../ST-iPhonie apply --check "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
          git -C ../ST-iPhonie apply "$GITHUB_WORKSPACE/integration/embedded-phone-source/local-changes.patch"
      - name: Build art, embedded phone and production frontend
        run: |
          npm run art:build
          npm run phone:build
          npm run build
      - name: Three-protagonist unit and save-migration regression
        run: npx vitest run tests/third-protagonist.test.ts tests/runtime.test.ts tests/npc-phone.test.ts tests/npc-phone-lifecycle.test.ts tests/dual-narrative.test.ts --reporter=dot
      - name: Install Chromium and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Switch portraits, state and four-viewport layout
        run: npx playwright test tests/e2e/emma-switch.spec.ts --workers=1 --reporter=line --trace=retain-on-failure
      - name: Preserve switch screenshots and state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emma-switch-qa
          retention-days: 14
          if-no-files-found: warn
          path: |
            outputs/emma-switch-qa/
            test-results/
