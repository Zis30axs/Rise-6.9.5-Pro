<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}#fixture-note{font:12px system-ui;padding:8px}</style></head><body>
<div id="fixture-note">Layout regression fixture — not a complete game or a real-device test.</div><input id="native-input" value="原生草稿">
<template id="shell-fixture">
<div id="unread-city-app"><div class="uc-shell" data-presentation-mode="novel" data-reading-mode="compact" data-active-window="">
<header class="world-chrome"><div class="world-heading"><button class="wordmark">未读之城<span>一段正在发生的日常</span></button><div class="topbar-world"><span>学生宿舍</span><span>第 1 天</span><time>20:15</time></div></div><div class="host-actions"><button aria-label="切换聊天并恢复原生界面">切换聊天</button><button aria-label="退出沉浸界面，恢复酒馆原生界面">退出酒馆 ↗</button></div></header>
<nav class="presentation-switch"><button>3D 漫游</button><button aria-pressed="true">纯小说</button></nav>
<nav class="tool-dock" aria-label="世界面板"></nav>
<section class="reading-layer" aria-label="小说正文"><header class="reading-heading"><div><span class="reading-caption">此刻的故事</span></div><div class="reading-actions"><button>专注阅读</button></div></header>
<p class="room-activity-receipt">查看了宿舍衣柜与房间陈设，没有取放物品。<span>已记入状态，可继续故事。</span></p>
<div class="novel-dialogue"><button class="novel-dialogue-text" aria-label="下一句剧情"><span class="novel-speech">【原型示例】傍晚的风穿过校园南门。手机轻震了两下。你可以先读消息、去一个地方，或留在这里说出自己的行动。</span></button><div class="novel-dialogue-controls"><button>全文回看</button></div></div>
<form class="composer"><textarea aria-label="接下来，你想做什么？" rows="1" maxlength="2000" placeholder="写下你的行动，或说一句想说的话……"></textarea><button type="submit">继续故事 <span>↗</span></button></form>
</section></div></div>
</template>
<script>
window.mountFixture = (baseCss, mode, transform = '') => {
  document.documentElement.style.transform = transform;
  if (transform) document.documentElement.style.height = '0px';
  const root = document.createElement('div'); root.setAttribute('data-unread-city-root', '');
  root.style.cssText = 'position:fixed;inset:0;height:100dvh;z-index:2147483000;isolation:isolate;';
  const shadow = root.attachShadow({ mode: 'open' });
  const style = document.createElement('style'); style.textContent = baseCss; shadow.append(style);
  shadow.append(document.querySelector('#shell-fixture').content.cloneNode(true));
  shadow.querySelector('.uc-shell').dataset.presentationMode = mode;
  const dock = shadow.querySelector('.tool-dock');
  ['手机','地图','地点','日程','背包','状态'].forEach((name, i) => {
    const button = document.createElement('button'); button.setAttribute('aria-label', name);
    if (!i) button.className = 'phone-launcher';
    button.innerHTML = '<span class="tool-icon"><svg viewBox="0 0 24 24"><path d="M5 3h14v18H5Z"/></svg>'+(!i ? '<span class="phone-unread-badge">2</span>' : '')+'</span><span class="tool-label">'+name+(!i ? '<small>有未读</small>' : '')+'</span>';
    dock.append(button);
  });
  const rescue = document.createElement('button'); rescue.type = 'button'; rescue.textContent = '恢复酒馆'; rescue.setAttribute('data-unread-city-rescue', '');
  rescue.style.cssText = 'position:fixed;right:12px;top:calc(100dvh - 46px);z-index:2147483647;padding:8px 12px;border:1px solid #a4b6a7;border-radius:6px;background:#f5f1e5;color:#263c39;font:12px system-ui;cursor:pointer;';
  document.body.append(root,rescue);
  window.originalRootStyle = root.getAttribute('style'); window.originalRescueStyle = rescue.getAttribute('style');
  window.legacyResize = () => { const inset = innerWidth <= 760 ? 80 : 12; rescue.style.top = Math.max(8, innerHeight - inset - (Math.ceil(rescue.getBoundingClientRect().height) || 34))+'px'; rescue.style.bottom='auto'; };
  window.addEventListener('resize', window.legacyResize); window.legacyResize();
  shadow.querySelector('form').addEventListener('submit', e => {e.preventDefault(); document.body.dataset.submitted=shadow.querySelector('textarea').value;});
  rescue.addEventListener('click', () => { window.lease?.dispose(); root.remove(); rescue.remove(); });
};
window.mockViewport = (height, top=0) => {
  const target = new EventTarget(); Object.assign(target,{height, width:innerWidth, offsetTop:top, offsetLeft:0, scale:1});
  Object.defineProperty(window,'visualViewport',{configurable:true,value:target}); return target;
};
window.layoutMetrics = () => {
  const root = document.querySelector('[data-unread-city-root]'), shadow = root.shadowRoot;
  const box = el => { const b=el.getBoundingClientRect();return {x:b.x,y:b.y,width:b.width,height:b.height,right:b.right,bottom:b.bottom};};
  const q = selector => box(shadow.querySelector(selector));
  return {root:box(root), shell:q('.uc-shell'), rescue:box(document.querySelector('[data-unread-city-rescue]')), dock:q('.tool-dock'), composer:q('.composer'), input:q('textarea'), send:q('button[type=submit]'), reading:q('.reading-layer'), title:q('.wordmark'), chat:q('.host-actions > button'), nav:Array.from(shadow.querySelectorAll('.tool-dock button')).map(box), visibleHeight:window.visualViewport?.height||innerHeight, short:root.dataset.ucShort, overflow:shadow.querySelector('.uc-shell').scrollWidth > shadow.querySelector('.uc-shell').clientWidth};
};
</script></body></html>
